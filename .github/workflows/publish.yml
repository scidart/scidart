# Publishes to pub.dev when a tag like v1.2.3 is pushed.
# Requires automated publishing enabled on pub.dev (package Admin tab):
# repository scidart/scidart, tag pattern v{{version}}.
name: Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
