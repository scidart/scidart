# Lint rules: https://dart.dev/tools/linter-rules
include: package:lints/recommended.yaml

linter:
  rules:
    # Public names follow the mathematical notation and the SciPy/NumPy/JAMA
    # names they port (R2, Nx, pass_zero, LOG_MAX_VALUE, Btu...). Renaming them
    # would break the public API.
    constant_identifier_names: false
    non_constant_identifier_names: false

analyzer:
  exclude:
    - scratch/**
